name: Build nxnative IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # [FIXED] Updated dependencies to match official README (glslang, nsz, zbic, etc.)
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang unar
          python -m pip install --upgrade pip
          python -m pip install lz4 "capstone>=5,<6" fonttools nsz zbic gdown "backports.zstd; python_version < '3.14'"

      # [FIXED] Explicitly select Xcode and force-download the missing Metal toolchain component
      - name: Select Xcode and install Metal toolchain
        shell: bash
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild -downloadPlatform iOS || true

      # (Make sure your step that downloads or places your game NSP and prod.keys 
      # into $RUNNER_TEMP/GameFiles and $RUNNER_TEMP/nxnative/prod.keys is right here)

      # [FIXED] Removed the broken dmsh_chain.py step and simplified the build command
      - name: Build unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_ipa_from_nsp.py "$RUNNER_TEMP/GameFiles" -k "$RUNNER_TEMP/nxnative/prod.keys"
          IPA="$(find "$RUNNER_TEMP/GameFiles" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA"
          cp "$IPA" "$RUNNER_TEMP/NxNative.ipa"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NxNative-IPA
          path: ${{ runner.temp }}/NxNative.ipa
